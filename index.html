<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="con">

        <h1>Calculator of 2 Numbers</h1>

        <div class="container">
            <div class="inputs">
                <label for="num1">Num1
                    <input type="number" id="num1">
                </label>
                <label for="num2">Num2
                    <input type="number" id="num2">
                </label>
            </div>

            <div>
                <button class="btn">Addition</button>
                <button class="btn">Subtraction</button>
                <button class="btn">Multiplication</button>
                <button class="btn">Division</button>
                <button class="btn">Modulus</button>
                <button class="btn">Power</button>
            </div>
        </div>

        <div id="result">Result</div>

    </div>

    <script src="script.js"></script>


</html>
